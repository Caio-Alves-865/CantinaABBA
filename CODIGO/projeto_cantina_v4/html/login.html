<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Digital | Acesso</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/login.css">
    <script>
        if (localStorage.getItem('tema_cantina') === 'escuro') {
            document.documentElement.classList.add('tema-escuro');
        }
    </script>
</head>
<body class="body-login">
    <div id="toast-container" class="toast-container"></div>
    <div class="controle-tema-login">
        
        <a href="index.html" class="btn-voltar-home" title="Voltar para a página inicial">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Voltar</span>
        </a>

        <button id="btn-tema" class="btn-tema" title="Mudar Tema">
            <svg class="icone-lua" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="icone-sol" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <div class="container-login">
        
        <div class="logo-login">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <h1>Cantina Digital</h1>
        </div>

        <div class="box-autenticacao">
            
            <div class="abas-login">
                <button class="aba-btn ativo" onclick="mudarAba('tela-login', this)">Entrar</button>
                <button class="aba-btn" onclick="mudarAba('tela-cadastro', this)">Cadastrar</button>
            </div>

            <div id="tela-login" class="tela-auth ativa">
                <form id="form-login" novalidate>
                    <div class="grupo-input" id="grupo-login-email">
                        <label for="login-email">E-mail Institucional</label>
                        <input type="email" id="login-email" placeholder="@aluno.ifsp.edu.br" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <div class="grupo-input" id="grupo-login-senha">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" placeholder="••••••••" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <div class="opcoes-extras">
                        <a href="#" onclick="abrirRecuperacao(event)">Esqueci minha senha</a>
                    </div>
                    <button type="submit" class="btn-principal">Entrar no Sistema</button>
                </form>
            </div>

            <div id="tela-cadastro" class="tela-auth">
                <form id="form-cadastro" novalidate>
                    <div class="grupo-input" id="grupo-cad-nome">
                        <label for="cad-nome">Nome Completo</label>
                        <input type="text" id="cad-nome" placeholder="Seu nome" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <div class="grupo-input" id="grupo-cad-email">
                        <label for="cad-email">E-mail</label>
                        <input type="email" id="cad-email" placeholder="@aluno.ifsp.edu.br" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <div class="grupo-input" id="grupo-cad-senha">
                        <label for="cad-senha">Criar Senha</label>
                        <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <button type="submit" class="btn-principal">Criar Conta</button>
                </form>
            </div>

            <div id="tela-recuperacao" class="tela-auth">
                <h4>Recuperar Senha</h4>
                <p class="texto-instrucao">Digite seu e-mail para receber o código de validação.</p>
                
                <form id="form-pedir-codigo" novalidate>
                    <div class="grupo-input" id="grupo-rec-email">
                        <label for="rec-email">E-mail</label>
                        <input type="email" id="rec-email" placeholder="Seu e-mail cadastrado" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <button type="submit" class="btn-principal">Enviar Código</button>
                    <button type="button" class="btn-voltar" onclick="voltarParaLogin()">Voltar ao Login</button>
                </form>

                <form id="form-nova-senha" style="display: none;" novalidate>
                    <div class="mensagem-sucesso-email">Código enviado! Verifique sua caixa de entrada.</div>
                    
                    <div class="grupo-input" id="grupo-rec-codigo">
                        <label for="rec-codigo">Código de Validação (Ex: 123456)</label>
                        <input type="text" id="rec-codigo" placeholder="Digite o código" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <div class="grupo-input" id="grupo-rec-nova-senha">
                        <label for="rec-nova-senha">Nova Senha</label>
                        <input type="password" id="rec-nova-senha" placeholder="••••••••" required>
                        <span class="mensagem-erro"></span>
                    </div>
                    <button type="submit" class="btn-principal">Redefinir Senha</button>
                </form>
            </div>

        </div>
    </div>

    <script src="../js/script_login.js"></script>
    <script src="../js/script_auth.js"></script>
</body>
</html>
